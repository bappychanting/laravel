version: "3.8"

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: demo_laravel_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - demo_laravel_storage:/var/www/html/storage
      - demo_laravel_cache:/var/www/html/bootstrap/cache
    networks:
      - demo_laravel_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: demo_laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - demo_laravel_storage:/var/www/html/storage
      - demo_laravel_cache:/var/www/html/bootstrap/cache
      # mount nginx.conf here; remove COPY from Dockerfile
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - demo_laravel_net

volumes:
  demo_laravel_storage:
  demo_laravel_cache:


networks:
  demo_laravel_net:
